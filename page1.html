<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEDGATE System</title>
<style>
  :root {
    --bg-color: #000000;
    --accent: #00FF9C;
    --text-sec: #FFFFFF;
    --text-dim: #888888;
    --font-mono: 'Courier New', Courier, monospace;
  }
  
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--text-sec);
    font-family: var(--font-mono);
    overflow: hidden;
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  
  * {
    box-sizing: border-box;
  }

  /* Layout */
  #left-panel {
    width: 55%;
    padding: 4rem 4rem 4rem 6rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    border-right: 1px solid rgba(0, 255, 156, 0.2);
    box-shadow: inset -20px 0 50px -30px var(--accent);
  }
  
  #right-panel {
    width: 45%;
    padding: 4rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  
  /* Animations */
  .fade-in { opacity: 0; animation: fadeIn 1s forwards; }
  .slide-in { opacity: 0; transform: translateX(-30px); animation: slideIn 0.8s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
  
  .delay-1 { animation-delay: 0.5s; }
  .delay-2 { animation-delay: 1s; }
  
  /* Typography */
  h1.title {
    color: var(--accent);
    text-transform: uppercase;
    font-size: 2.2rem;
    margin-bottom: 2.5rem;
    letter-spacing: 2px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 0.5rem;
    display: inline-block;
    text-shadow: 0 0 10px rgba(0,255,156,0.3);
  }
  
  /* Elements */
  .btn {
    display: inline-block;
    padding: 1rem 2rem;
    background: rgba(0, 255, 156, 0.1);
    color: var(--accent);
    border: 1px solid var(--accent);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 2rem;
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: bold;
  }
  .btn:hover {
    background: var(--accent);
    color: var(--bg-color);
    box-shadow: 0 0 20px var(--accent);
  }
  
  #next-btn {
    position: absolute;
    bottom: 3rem;
    right: 3rem;
    z-index: 10;
  }
  
  .typewriter-line {
    overflow: hidden;
    white-space: pre-wrap;
    margin: 0.8rem 0;
    font-size: 1.3rem;
    min-height: 1.8rem;
    line-height: 1.5;
  }
  
  .cursor::after {
    content: '█';
    animation: blink 1s step-start infinite;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }
  
  .flowchart {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .flowchart.horizontal {
    flex-direction: row;
    align-items: center;
    flex-wrap: wrap;
    gap: 1.5rem;
  }
  .node {
    border: 1px solid var(--accent);
    padding: 1rem 1.5rem;
    border-radius: 4px;
    background: rgba(0, 255, 156, 0.05);
    color: var(--text-sec);
    font-size: 1.1rem;
    transition: all 0.3s;
  }
  .node.highlight {
    background: rgba(0, 255, 156, 0.2);
    box-shadow: 0 0 15px rgba(0,255,156,0.4);
    border-color: var(--accent);
  }
  .arrow {
    color: var(--accent);
    font-weight: bold;
    padding: 0 1rem;
    font-size: 1.2rem;
  }
  .arrow.down {
    padding: 0.5rem 0;
    margin-left: 2rem;
  }
  
  .story-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  .story-frame {
    border: 1px dashed var(--text-dim);
    padding: 1.5rem;
    opacity: 0.4;
    transition: all 0.3s;
    background: rgba(255,255,255,0.02);
  }
  .story-frame.active {
    opacity: 1;
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,255,156,0.2);
  }
  
  /* Right Panel Content */
  #right-text {
    margin-top: 4rem;
    font-size: 1.2rem;
    line-height: 1.6;
    text-align: left;
    width: 80%;
    color: var(--text-sec);
  }
  #right-text ul {
    list-style-type: none;
    padding-left: 0;
    margin-top: 1rem;
  }
  #right-text li {
    margin: 1rem 0;
    padding-left: 2rem;
    position: relative;
    font-size: 1.1rem;
  }
  #right-text li::before {
    content: '>';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: bold;
  }
  
  /* Robot Animation CSS */
  #robot-container {
    width: 250px;
    height: 350px;
    filter: drop-shadow(0 0 10px rgba(0,255,156,0.3));
  }
  
  .robot-svg {
    width: 100%;
    height: 100%;
    stroke: var(--accent);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  /* Base animations */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  .robot-idle { animation: float 4s ease-in-out infinite; }
  
  /* Robot parts */
  #r-head { transform-origin: 125px 90px; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  #r-l-arm { transform-origin: 75px 170px; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  #r-r-arm { transform-origin: 175px 170px; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  #r-eye-l, #r-eye-r { fill: var(--accent); transition: transform 0.2s, fill 0.3s; transform-origin: center; }
  
  /* Robot Gestures */
  .action-point-left #r-l-arm { transform: rotate(45deg); }
  .action-nod #r-head { animation: nod 2s ease-in-out infinite; }
  @keyframes nod { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(10deg); } 40% { transform: rotate(-5deg); } }
  .action-shake #r-head { animation: shake 0.5s ease-in-out; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-15deg); } 75% { transform: rotate(15deg); } }
  .action-expand #r-l-arm { transform: rotate(45deg); }
  .action-expand #r-r-arm { transform: rotate(-45deg); }
  .action-wave #r-l-arm { animation: armWave 2.5s ease-in-out infinite; }
  .action-wave #r-r-arm { animation: armWave 2.5s ease-in-out infinite reverse; }
  @keyframes armWave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(60deg); } }
  .action-concerned #r-eye-l { transform: scaleY(0.2); }
  .action-concerned #r-eye-r { transform: scaleY(0.2); }
  .action-point-fwd #r-r-arm { transform: rotate(-90deg); }
  .action-point-down #r-l-arm { transform: rotate(-45deg); }
  .action-point-down #r-r-arm { transform: rotate(45deg); }
  
  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-color); }
  ::-webkit-scrollbar-thumb { background: rgba(0, 255, 156, 0.3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>

          <div id="final-thought-container" style="min-height: 200px; margin-top:2rem;"></div>
          <button class="btn fade-in delay-2" style="display:none; font-size:1.2rem; padding:1.2rem 2.5rem; border-width:2px; margin-right: 1rem;" id="restart-btn" onclick="location.reload()">Restart Experience</button>
          <a href="https://github.com/UAnjana000/FEDGATE-Distributed-ML-systems-in-Finance" target="_blank" class="btn fade-in delay-2" style="display:none; font-size:1.2rem; padding:1.2rem 2.5rem; border-width:2px;" id="final-github-btn">View GitHub Repo</a>
        `,
        rightTextLines: [],
        leftLines: [
          "\"Financial collapse is not sudden.\"",
          "\"It is a sequence.\"\n",
          "\"This system breaks that sequence.\""
        ],
        robotClass: "action-nod"
      }
    ];

    let currentStep = 0;
    const contentContainer = document.getElementById('content-container');
    const rightText = document.getElementById('right-text');
    const nextBtn = document.getElementById('next-btn');
    const robot = document.getElementById('robot-container');

    async function typeWriter(text, element, speed = 40) {
      return new Promise(resolve => {
        let i = 0;
        element.innerHTML = '';
        element.classList.add('cursor');
        
        function type() {
          if (i < text.length) {
            if (text.charAt(i) === '\n') {
                element.innerHTML += '<br>';
            } else {
                element.innerHTML += text.charAt(i);
            }
            i++;
            setTimeout(type, speed);
          } else {
            element.classList.remove('cursor');
            resolve();
          }
        }
        type();
      });
    }

    async function renderStep(index) {
      if (index >= steps.length) return;
      
      const step = steps[index];
      
      // Clear previous
      contentContainer.innerHTML = '';
      rightText.innerHTML = '';
      
      // Robot Animation
      robot.className = 'robot-idle'; // reset
      void robot.offsetWidth; // trigger reflow
      if(step.robotClass) robot.classList.add(step.robotClass);
      
      // Left Panel Title
      if (step.title) {
        const titleEl = document.createElement('h1');
        titleEl.className = 'title slide-in';
        titleEl.textContent = step.title;
        contentContainer.appendChild(titleEl);
      }
      
      // Render Left Content
      if (step.leftLines) {
        if (index === 0) {
            for (let line of step.leftLines) {
                const p = document.createElement('div');
                p.className = 'typewriter-line';
                contentContainer.appendChild(p);
                await typeWriter(line, p, 40);
            }
            contentContainer.innerHTML += step.leftHtml; 
            setTimeout(() => { 
                const btn = document.getElementById('github-btn');
                if(btn) btn.style.display = 'inline-block'; 
            }, 500);
        } else if (index === steps.length - 1) { // Last step
            contentContainer.innerHTML += step.leftHtml; 
            const fc = document.getElementById('final-thought-container');
            for (let line of step.leftLines) {
               const p = document.createElement('div');
               p.className = 'typewriter-line';
               p.style.fontSize = '1.5rem';
               p.style.color = 'var(--accent)';
               fc.appendChild(p);
               await typeWriter(line, p, 50);
            }
            setTimeout(() => { 
                const btn = document.getElementById('restart-btn');
                if(btn) btn.style.display = 'inline-block'; 
                const ghBtn = document.getElementById('final-github-btn');
                if(ghBtn) ghBtn.style.display = 'inline-block'; 
            }, 800);
        }
      } else if (step.leftHtml) {
        contentContainer.innerHTML += step.leftHtml;
      }
      
      if (step.onRender) step.onRender();
      
      // Right Panel Text (Typewriter)
      if (step.rightTextLines && step.rightTextLines.length > 0) {
        let ul = null;
        for (let line of step.rightTextLines) {
          if (line.trim().startsWith('*')) {
            if (!ul) {
              ul = document.createElement('ul');
              rightText.appendChild(ul);
            }
            const li = document.createElement('li');
            ul.appendChild(li);
            await typeWriter(line.replace('*', '').trim(), li, 40);
          } else {
            ul = null; // reset list
            const p = document.createElement('div');
            p.className = 'typewriter-line';
            rightText.appendChild(p);
            await typeWriter(line, p, 40);
          }
        }
      }
      
      // Next button logic
      if (index === steps.length - 1) {
        nextBtn.style.display = 'none';
      } else {
        nextBtn.style.display = 'inline-block';
      }
    }

    nextBtn.addEventListener('click', () => {
      // Robot slight shake + point forward
      robot.className = 'robot-idle action-shake action-point-fwd';
      setTimeout(() => {
        currentStep++;
        renderStep(currentStep);
      }, 500);
    });

    // Start
    renderStep(0);
  </script>
</body>
</html>
