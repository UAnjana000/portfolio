<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anju Portfolio Interface</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using Phosphor icons for modern, outline-style logos matching the aesthetic -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts for typography -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="cursor-dot">♟</div>
    <div class="cursor-ring"></div>

    <div class="background" style="background-image: url('bg.png');"></div>
    <div class="overlay"></div>

    <main class="content glass-panel">
        <!-- Retro Pixel Companion Sprite -->
        <div class="companion-container" title="Click me!">
            <div class="pixel-companion">
                <div class="speech-bubble">Hello!</div>
                <svg viewBox="0 0 100 100" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 20 90 L 80 90 A 5 5 0 0 1 85 95 L 85 100 L 15 100 L 15 95 A 5 5 0 0 1 20 90 Z"
                        fill="var(--neon-orange)" />
                    <rect x="25" y="80" width="50" height="10" rx="4" fill="var(--neon-orange)" />
                    <path d="M 30 80 Q 40 50 40 35 L 60 35 Q 60 50 70 80 Z" fill="var(--neon-orange)" />
                    <rect x="35" y="30" width="30" height="5" rx="2" fill="var(--neon-orange)" />
                    <path d="M 30 30 L 20 5 L 40 15 L 50 0 L 60 15 L 80 5 L 70 30 Z" fill="var(--neon-orange)" />
                    <circle cx="20" cy="5" r="4" fill="var(--neon-orange)" />
                    <circle cx="50" cy="0" r="4" fill="var(--neon-orange)" />
                    <circle cx="80" cy="5" r="4" fill="var(--neon-orange)" />
                    <!-- Cute Cartoon Face -->
                    <circle cx="43" cy="55" r="3" fill="var(--bg-color)" />
                    <circle cx="57" cy="55" r="3" fill="var(--bg-color)" />
                    <path d="M 46 62 Q 50 66 54 62" fill="none" stroke="var(--bg-color)" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
            </div>
        </div>

        <div class="profile-badge">
            <span class="status-dot"></span> Online
        </div>
        <h1 class="title">Anjana U.</h1>
        <p class="subtitle">Distributed Systems & ML Developer</p>


        <div class="nodes-container">
            <button class="node-btn" data-target="linkedin" data-url="https://www.linkedin.com/in/anjana-u-an1/">
                <i class="ph ph-linkedin-logo"></i>
                <span>LinkedIn</span>
            </button>
            <button class="node-btn" data-target="cv"
                data-url="https://drive.google.com/drive/folders/1qxJQR0iK1Eh4rccXN594Sms5zip3iioE?usp=sharing">
                <i class="ph ph-file-text"></i>
                <span>Resume </span>
            </button>
            <button class="node-btn" data-target="github"
                data-url="http://127.0.0.1:5500/page1.html">
                <i class="ph ph-github-logo"></i>
                <span>The Project</span>
            </button>
        </div>
    </main>

    <div class="modal hidden" id="redirectModal">
        <div class="modal-content">
            <div class="modal-icon-container">
                <i id="modalIcon" class="ph"></i>
            </div>
            <h2 id="modalTitle" class="neon-text">Establishing Connection...</h2>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p id="modalUrl" class="url-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
